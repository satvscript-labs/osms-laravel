name: CI

# TEST-02 — run the suite on every push/PR, against BOTH engines:
#   • sqlite   — fast, matches local dev
#   • mariadb  — the production engine, which SQLite cannot fully stand in for
#     (lockForUpdate is a no-op on SQLite, the orders/subscriptions ENUMs are
#      relaxed, and the MySQL DATE_FORMAT birthday branch never runs there).
# Also builds the front-end so a broken Vite build fails the pipeline too.

on:
  push:
    branches: [main, dev, dev_audit]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mariadb]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: osms_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, bcmath, gd, zip, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env || true
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front-end
        run: |
          npm ci
          npm run build

      - name: Run tests (SQLite)
        if: matrix.db == 'sqlite'
        run: php artisan test

      - name: Run tests (MariaDB — production engine)
        if: matrix.db == 'mariadb'
        run: php artisan test -c phpunit.mysql.xml

  security:
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      # Fail the build if a dependency has a known vulnerability advisory.
      - run: composer audit
